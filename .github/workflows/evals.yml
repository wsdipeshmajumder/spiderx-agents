name: evals

# Cloud regression gate. Runs the offline eval suite (tests/test_offline.py) on
# every push and PR. No server, DB, or API keys needed — the suite synthesizes
# all its fixtures in-process, so it is deterministic and secret-free. It guards
# the code with no HTTP surface: the Fish Audio voice pipeline (audio codecs,
# sentence flushing, the live-call _bridge branch + degrade-to-Gemini), the
# fish_audio client shape, build-number lockstep, and import sanity.
#
# The online suite (tests/eval_suite.py) needs a running server + Postgres and
# runs from the pre-push hook locally; it is intentionally not in CI here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13 (matches the Railway runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline eval suite
        run: python tests/test_offline.py
